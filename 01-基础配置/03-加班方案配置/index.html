<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../assets/unified-navigation.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="refinements.css">
  <title>HR One · 加班方案配置</title>
</head>
<body data-unified-page="overtime-plan" data-unified-root="../../">
  <div class="layout">
    <aside class="sidebar"><div id="unifiedAttendanceNav"><a class="unified-nav__home" href="../../index.html">首页</a></div></aside>
    <main class="main">
      <header class="header"><div class="breadcrumb">考勤管理 / 基础配置 / <span>加班方案配置</span></div><div class="user-info">GMT+8:00　简体中文　用户信息</div></header>
      <section class="content">
        <div class="page-head"><h1>加班方案配置</h1></div>
        <section class="card query-card" aria-label="加班方案查询条件">
          <div class="query-flow">
            <label class="query-item"><span>方案名称</span><input id="queryName" placeholder="请输入方案名称"></label>
            <label class="query-item"><span>划分区域</span><select id="queryRegion"><option>全部</option><option>中国区</option></select></label>
            <label class="query-item"><span>状态</span><select id="queryStatus"><option>全部</option><option>启用</option><option>停用</option></select></label>
            <div class="query-actions"><button class="btn" id="resetQuery">重置</button><button class="btn btn-primary" id="runQuery">查询</button></div>
          </div>
        </section>
        <section class="card list-card" id="listView">
          <div class="card-head"><div class="card-title">方案列表 <span class="muted" id="countText">共 1 条</span></div><div class="actions"><button class="btn"><img src="../01-假期方案/export-icon.svg" alt="">导出</button><button class="btn">导出设置</button><button class="btn btn-primary" id="addPlan">＋ 新增</button></div></div>
          <div class="table-wrap"><table><thead><tr><th>方案名称</th><th>当前版本</th><th>划分区域</th><th>状态</th><th>创建人</th><th>创建时间</th><th>更新人</th><th>更新时间</th><th>操作</th></tr></thead><tbody id="planRows"><tr><td>中国区加班方案</td><td>00001</td><td>中国区</td><td><span class="status">启用</span></td><td>用户信息</td><td>2026-09-17 09:30</td><td>用户信息</td><td>2026-09-17 09:30</td><td><div class="row-actions"><button class="link editPlan">编辑</button><button class="link">复制</button><button class="link">更多</button></div></td></tr></tbody></table></div>
          <div class="pagination"><span>共 1 条</span><span><button class="page active">1</button>　20 条/页</span></div>
        </section>
      </section>
    </main>
  </div>

  <div class="modal-layer" id="editor" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="editorTitle">
      <header class="modal-head"><h2 id="editorTitle">新增加班方案</h2><button class="close" id="closeEditor" aria-label="关闭">×</button></header>
      <div class="modal-body">
        <div class="group-title">基本信息</div>
        <div class="form-grid basic-grid">
          <label class="form-item"><span><b>*</b> 方案名称</span><input id="planName" placeholder="请输入方案名称"></label>
          <label class="form-item"><span>方案版本</span><input disabled value="00001"></label>
          <label class="form-item"><span><b>*</b> 划分区域</span><select id="planRegion"><option value="">请选择</option><option>中国区</option></select></label>
          <label class="form-item"><span>适用范围匹配方式</span><select><option>请选择</option></select></label>
        </div>
        <div class="day-tabs" role="tablist" aria-label="加班日期类型">
          <button class="day-tab active" data-day="workday" role="tab">工作日加班</button>
          <button class="day-tab" data-day="restday" role="tab">公休日加班</button>
          <button class="day-tab" data-day="holiday" role="tab">节假日加班</button>
          <button class="day-tab" disabled>综合工时加班</button><button class="day-tab" disabled>特殊规则</button>
        </div>
        <div id="dayPanel"></div>
      </div>
      <footer class="modal-foot"><button class="btn" id="cancelEditor">取消</button><button class="btn btn-primary" id="savePlan">确定</button></footer>
    </section>
  </div>
  <div class="toast" id="toast" hidden></div>
  <script src="../../assets/unified-navigation.js"></script>
  <script src="app.js"></script>
</body></html>
