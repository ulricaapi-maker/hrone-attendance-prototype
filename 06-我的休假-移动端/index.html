<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HR One · 移动端休假完整原型</title>
<style>
:root{
  --primary:#2563eb;--primary-dark:#1d4ed8;--primary-soft:#eff6ff;--primary-line:#bfdbfe;
  --success:#10b981;--success-soft:#ecfdf5;--warning:#f59e0b;--warning-soft:#fffbeb;
  --danger:#ef4444;--danger-soft:#fef2f2;--text:#0f172a;--text-2:#334155;--muted:#64748b;
  --placeholder:#94a3b8;--line:#e2e8f0;--line-soft:#f1f5f9;--surface:#fff;--page:#f3f6fa;
  --shadow:0 2px 10px rgba(15,23,42,.06);--radius:22px;--safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:#cbd5e1;color:var(--text);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
body{display:flex;justify-content:center;align-items:flex-start}
.app-shell{position:relative;width:100%;max-width:750px;height:100vh;min-height:720px;background:var(--page);overflow:hidden;box-shadow:0 0 40px rgba(15,23,42,.14)}
.status-bar{height:58px;padding:18px 34px 0;display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.96);font-size:14px;font-weight:700;position:relative;z-index:60}
.status-icons{display:flex;gap:8px;align-items:center;color:var(--text-2)}
.status-icons svg{width:19px;height:19px}
.page{position:absolute;top:58px;left:0;right:0;bottom:0;background:var(--page);opacity:0;pointer-events:none;transform:translateX(16px);transition:.2s ease;overflow:hidden}
.page.active{opacity:1;pointer-events:auto;transform:none}
.page-header{height:76px;background:#fff;display:flex;align-items:center;padding:0 26px;border-bottom:1px solid rgba(15,23,42,.06);position:relative;z-index:10}
.header{background:#fff}
.page-title{position:absolute;left:120px;right:120px;text-align:center;font-size:22px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-action{margin-left:auto;border:0;background:transparent;color:var(--primary);font-size:16px;font-weight:700;min-height:44px;padding:0 4px}
.back{width:52px;height:52px;border:0;border-radius:18px;background:transparent;display:grid;place-items:center}
.back:active{background:var(--line-soft)}
.back svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2.2}
.scroll{height:calc(100% - 76px);overflow-y:auto;padding:24px 28px 128px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{display:none}
.card{background:var(--surface);border:1px solid rgba(15,23,42,.055);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;margin-bottom:18px}
.section-label{display:inline-flex;align-items:center;min-height:32px;padding:4px 12px;background:#e8f0fe;border-radius:8px;font-size:15px;font-weight:700;color:#1e3a5f;margin-bottom:16px}
.hero{padding:26px;background:var(--surface);border:1px solid rgba(15,23,42,.055);border-radius:28px;box-shadow:var(--shadow);margin-bottom:18px}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
.hero-kicker{font-size:15px;color:var(--muted);font-weight:650}
.hero-total{font-size:48px;font-weight:800;line-height:1.1;margin-top:8px;letter-spacing:-1px}
.hero-total small{font-size:18px;margin-left:5px;color:var(--muted);font-weight:650}
.hero-link{border:0;background:var(--primary-soft);color:var(--primary);font-size:16px;font-weight:750;border-radius:17px;min-height:48px;padding:0 18px}
.hero-note{font-size:14px;color:var(--muted);line-height:1.6;margin-top:14px;padding-top:14px;border-top:1px solid var(--line-soft)}
.quota-row{width:100%;border:0;background:#fff;border-bottom:1px solid var(--line-soft);padding:20px 4px;display:grid;grid-template-columns:1fr auto;gap:16px;text-align:left}
.quota-row:last-child{border-bottom:0;padding-bottom:6px}
.quota-row:first-child{padding-top:4px}
.quota-name{font-size:18px;font-weight:750}
.quota-meta{font-size:14px;color:var(--muted);line-height:1.6;margin-top:5px}
.quota-balance{text-align:right;align-self:center}
.quota-number{font-size:26px;font-weight:800;color:var(--text)}
.quota-unit{font-size:13px;color:var(--placeholder);margin-top:2px}
.chev{display:inline-flex;align-items:center;color:var(--placeholder);font-size:24px;margin-left:6px}
.bottom-bar{position:absolute;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.97);border-top:1px solid rgba(15,23,42,.08);padding:16px 28px calc(16px + var(--safe-bottom));display:grid;grid-template-columns:1fr 1fr;gap:14px;min-height:92px}
.bottom-bar.single{grid-template-columns:1fr}
.btn{min-height:56px;border-radius:18px;border:1px solid var(--line);background:#fff;font-size:17px;font-weight:750;padding:0 18px}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 5px 14px rgba(37,99,235,.22)}
.btn.danger{color:var(--danger);border-color:#fecaca;background:#fff}
.btn.warning{color:#b45309;border-color:#fde68a;background:#fff}
.btn:disabled{background:#e5e7eb;border-color:#e5e7eb;color:#94a3b8;box-shadow:none;cursor:not-allowed}
.person-card{display:flex;align-items:center;gap:14px}
.avatar{width:58px;height:58px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-size:21px;font-weight:800;flex:0 0 auto}
.person-name{font-size:18px;font-weight:800}
.person-meta{font-size:14px;color:var(--muted);margin-top:5px;line-height:1.45}
.policy{padding:0;overflow:hidden}
.policy-toggle{width:100%;border:0;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:20px 22px;font-size:17px;font-weight:750;text-align:left}
.policy-body{display:none;padding:0 22px 20px;font-size:14px;line-height:1.75;color:var(--text-2)}
.policy.open .policy-body{display:block}
.policy.open .toggle-arrow{transform:rotate(180deg)}
.trial{border-color:var(--primary-line);background:#f8fbff}
.trial-head{display:flex;align-items:center;justify-content:space-between;gap:16px}
.trial-title{font-size:15px;color:var(--muted)}
.trial-value{font-size:30px;font-weight:850;color:var(--primary);margin-top:5px}
.text-link{border:0;background:transparent;color:var(--primary);font-size:15px;font-weight:750}
.trial-sub{font-size:14px;line-height:1.55;color:var(--muted);margin-top:12px}
.form-card{padding:0;overflow:hidden}
.field{min-height:76px;padding:18px 20px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:12px;background:#fff;width:100%;text-align:left}
.field:last-child{border-bottom:0}
.field.clickable:active{background:#f8fafc}
.field-label{font-size:16px;color:var(--muted);font-weight:650;flex:0 0 158px;line-height:1.45}
.required{color:var(--danger);margin-right:4px}
.rule-link{border:0;background:transparent;color:var(--primary);font-size:13px;font-weight:700;margin-left:7px;white-space:nowrap}
.field-value{margin-left:auto;min-width:0;text-align:right;font-size:16px;font-weight:650;line-height:1.5;word-break:break-word}
.field-value.placeholder{color:var(--placeholder);font-weight:500}
.field-value.readonly{color:var(--muted);font-weight:550}
.field-input{margin-left:auto;width:min(330px,55%);min-height:46px;border:1px solid var(--line);border-radius:14px;padding:8px 12px;background:#fff;text-align:right;outline:none;font-size:16px}
.field-input:focus,.textarea:focus,.daily-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.textarea-wrap{padding:18px 20px}
.textarea-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.textarea-label{font-size:16px;color:var(--muted);font-weight:650}
.counter{font-size:13px;color:var(--placeholder)}
.textarea{width:100%;min-height:116px;resize:none;border:1px solid var(--line);border-radius:15px;padding:13px 14px;outline:none;line-height:1.6;background:#fbfdff}
.error-text{display:none;color:var(--danger);font-size:13px;line-height:1.5;margin-top:7px}
.invalid .error-text{display:block}
.invalid .field-input,.invalid .textarea{border-color:#fca5a5;background:var(--danger-soft)}
.special-block{margin-top:18px}
.daily-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.daily-head strong{font-size:17px}
.small-btn{min-height:40px;border-radius:14px;border:1px solid var(--primary-line);background:var(--primary-soft);color:var(--primary);font-size:14px;font-weight:700;padding:0 12px}
.daily-card{border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:12px;background:#fff}
.daily-card:last-child{margin-bottom:0}
.daily-date{display:flex;align-items:center;justify-content:space-between;font-size:16px;font-weight:800;margin-bottom:14px}
.daily-status{font-size:13px;color:var(--muted);font-weight:600}
.daily-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.daily-item label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.daily-input{width:100%;height:46px;border:1px solid var(--line);border-radius:13px;padding:0 10px;background:#fff;outline:none}
.daily-input:disabled{background:#f1f5f9;color:#94a3b8}
.daily-result{grid-column:1/-1;background:#f8fafc;border-radius:13px;padding:12px 14px;display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.daily-result b{color:var(--text);font-size:16px}
.upload-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.upload-item{min-height:102px;border:1px dashed #cbd5e1;border-radius:16px;background:#f8fafc;padding:12px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:13px;line-height:1.4}
.upload-item.done{border-style:solid;border-color:#a7f3d0;background:var(--success-soft);color:#047857}
.upload-icon{font-size:27px;line-height:1;margin-bottom:8px}
.demo-panel{border:1px dashed #93c5fd;background:#f8fbff}
.demo-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.demo-title{font-size:16px;font-weight:800;color:#1e40af}
.demo-note{font-size:13px;color:var(--muted);line-height:1.55}
.chips{display:flex;gap:8px;overflow-x:auto;padding:3px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;min-height:40px;padding:0 14px;white-space:nowrap;color:var(--text-2);font-size:14px;font-weight:650}
.chip.active{background:var(--primary);border-color:var(--primary);color:#fff}
.demo-errors{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.demo-error{border:0;background:#fff7ed;color:#c2410c;border-radius:12px;padding:8px 11px;font-size:13px;font-weight:700}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:#e9eef5;border-radius:20px;padding:5px;margin-bottom:16px}
.tab{height:48px;border:0;background:transparent;border-radius:16px;font-size:16px;font-weight:750;color:var(--muted)}
.tab.active{background:#fff;color:var(--primary);box-shadow:var(--shadow)}
.filter-card{padding:16px;margin-bottom:16px}
.filter-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.filter-chip{min-height:56px;border:1px solid var(--line);border-radius:16px;background:#fff;padding:8px 12px;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:8px}
.filter-name{font-size:12px;color:var(--placeholder)}
.filter-value{font-size:15px;font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:235px}
.filter-reset{display:flex;justify-content:flex-end;margin-top:10px}
.record-card{background:#fff;border:1px solid rgba(15,23,42,.055);border-radius:22px;padding:20px;margin-bottom:14px;box-shadow:var(--shadow)}
.record-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.record-type{font-size:19px;font-weight:850}
.record-no{font-size:13px;color:var(--placeholder);margin-top:5px}
.tag{display:inline-flex;align-items:center;min-height:30px;padding:0 11px;border-radius:999px;font-size:13px;font-weight:750;white-space:nowrap}
.tag.blue{color:#1d4ed8;background:#eff6ff}.tag.green{color:#047857;background:#ecfdf5}.tag.gray{color:#64748b;background:#f1f5f9}.tag.red{color:#b91c1c;background:#fef2f2}.tag.orange{color:#b45309;background:#fffbeb}
.record-period{font-size:15px;line-height:1.6;color:var(--text-2);margin-top:16px}
.record-meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;padding:13px 0;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)}
.meta-item span{display:block;font-size:12px;color:var(--placeholder)}
.meta-item b{display:block;font-size:15px;margin-top:4px}
.record-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:13px}
.action-link{border:0;background:transparent;color:var(--primary);font-size:15px;font-weight:750;min-height:38px;padding:0 4px}
.action-link.danger{color:var(--danger)}
.empty{text-align:center;padding:76px 20px;color:var(--muted);font-size:15px;line-height:1.7}
.empty-icon{font-size:46px;opacity:.45;margin-bottom:12px}
.summary-card{background:#fff;border-radius:22px;border:1px solid rgba(15,23,42,.055);box-shadow:var(--shadow);padding:22px;margin-bottom:18px}
.summary-row{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.summary-title{font-size:21px;font-weight:850}
.summary-meta{font-size:13px;color:var(--muted);line-height:1.7;margin-top:8px}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 22px}
.info-item.full{grid-column:1/-1}
.info-label{font-size:13px;color:var(--placeholder);margin-bottom:6px}
.info-value{font-size:16px;line-height:1.55;word-break:break-word}
.timeline{position:relative;padding-left:28px}
.timeline:before{content:"";position:absolute;left:7px;top:9px;bottom:9px;width:2px;background:#dbe4ef}
.timeline-item{position:relative;padding-bottom:24px}
.timeline-item:last-child{padding-bottom:0}
.timeline-dot{position:absolute;left:-28px;top:5px;width:16px;height:16px;border-radius:50%;background:var(--primary);border:4px solid #dbeafe}
.timeline-dot.pending{background:#fff;border-color:#93c5fd}.timeline-dot.red{background:var(--danger);border-color:#fee2e2}.timeline-dot.gray{background:#94a3b8;border-color:#e2e8f0}
.timeline-title{font-size:16px;font-weight:800}
.timeline-meta{font-size:14px;color:var(--muted);line-height:1.6;margin-top:5px}
.source-link{border:0;background:transparent;color:var(--primary);font-weight:750;text-align:left;padding:0}
.notice{border-radius:16px;padding:14px 16px;font-size:14px;line-height:1.65;margin-bottom:16px;background:var(--warning-soft);color:#92400e;border:1px solid #fde68a}
.notice.danger{background:var(--danger-soft);color:#991b1b;border-color:#fecaca}
.sheet-mask,.modal-mask{position:absolute;inset:0;background:rgba(15,23,42,.42);z-index:100;opacity:0;pointer-events:none;transition:.2s}
.sheet-mask.show,.modal-mask.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:30px 30px 0 0;max-height:78%;transform:translateY(105%);transition:.25s ease;display:flex;flex-direction:column;overflow:hidden}
.sheet-mask.show .sheet{transform:none}
.sheet-handle{width:56px;height:6px;border-radius:3px;background:#dbe2ea;margin:12px auto 4px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 26px;border-bottom:1px solid var(--line-soft)}
.sheet-title{font-size:20px;font-weight:800}
.icon-btn{width:46px;height:46px;border:0;border-radius:15px;background:#f8fafc;font-size:25px;color:var(--muted)}
.sheet-body{padding:18px 26px;overflow-y:auto}
.sheet-option{width:100%;min-height:66px;border:0;border-bottom:1px solid var(--line-soft);background:#fff;text-align:left;display:flex;align-items:center;justify-content:space-between;padding:12px 3px;font-size:16px;font-weight:700}
.sheet-option small{display:block;font-size:13px;color:var(--muted);font-weight:500;margin-top:3px}
.sheet-option.selected{color:var(--primary)}
.sheet-foot{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 26px calc(14px + var(--safe-bottom));border-top:1px solid var(--line-soft)}
.sheet-date-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sheet-field label{font-size:13px;color:var(--muted);display:block;margin-bottom:7px}
.sheet-field input{width:100%;height:54px;border:1px solid var(--line);border-radius:15px;padding:0 12px;background:#fff}
.modal{position:absolute;left:30px;right:30px;top:50%;transform:translateY(-46%) scale(.98);background:#fff;border-radius:24px;padding:24px;opacity:0;transition:.2s}
.modal-mask.show .modal{opacity:1;transform:translateY(-50%) scale(1)}
.modal-title{font-size:21px;font-weight:850;margin-bottom:12px}
.modal-body{font-size:15px;color:var(--text-2);line-height:1.75;max-height:55vh;overflow:auto}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
.modal-actions .btn{min-height:50px;font-size:16px;min-width:112px}
.success-page{position:absolute;inset:0;background:var(--page);z-index:150;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;opacity:0;pointer-events:none;transition:.24s}
.success-page.show{opacity:1;pointer-events:auto}
.success-icon{width:92px;height:92px;border-radius:50%;background:var(--success-soft);color:var(--success);display:grid;place-items:center;font-size:48px;font-weight:800}
.success-title{font-size:27px;font-weight:850;margin-top:22px}
.success-sub{font-size:15px;color:var(--muted);line-height:1.65;text-align:center;margin-top:10px}
.success-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;margin-top:34px}
.toast{position:absolute;left:50%;bottom:118px;transform:translate(-50%,18px);z-index:220;background:rgba(15,23,42,.92);color:#fff;border-radius:16px;padding:13px 18px;font-size:15px;line-height:1.45;max-width:82%;text-align:center;opacity:0;pointer-events:none;transition:.2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.hidden{display:none!important}
@media(max-width:480px){
  .status-bar{height:48px;padding:13px 20px 0}.page{top:48px}.page-header{height:58px;padding:0 14px}.page-title{left:84px;right:84px;font-size:17px}.back{width:42px;height:42px;border-radius:13px}.back svg{width:22px;height:22px}
  .scroll{height:calc(100% - 58px);padding:14px 14px 100px}.card,.summary-card{padding:16px;border-radius:16px;margin-bottom:12px}.hero{padding:18px;border-radius:20px;margin-bottom:12px}.hero-total{font-size:36px}.hero-link{font-size:14px;min-height:42px;padding:0 13px}
  .quota-name{font-size:16px}.quota-number{font-size:22px}.field{min-height:62px;padding:13px 15px}.field-label{font-size:14px;flex-basis:116px}.field-value,.field-input{font-size:14px}.field-input{min-height:40px}.bottom-bar{padding:10px 14px calc(10px + var(--safe-bottom));min-height:72px}.btn{min-height:48px;border-radius:14px;font-size:15px}.section-label{font-size:13px;min-height:28px;margin-bottom:12px}.trial-value{font-size:24px}
  .daily-card{padding:14px;border-radius:15px}.daily-grid{gap:9px}.daily-input{height:42px}.upload-grid{grid-template-columns:repeat(2,1fr)}.filter-row{grid-template-columns:1fr 1fr}.filter-chip{min-height:48px}.filter-value{font-size:13px;max-width:116px}.record-card{padding:16px;border-radius:16px}.record-type{font-size:17px}.info-grid{gap:15px 16px}.info-value{font-size:14px}.modal{left:18px;right:18px}.sheet-head,.sheet-body,.sheet-foot{padding-left:18px;padding-right:18px}
}
</style>
</head>
<body>
<main class="app-shell" id="app">

const leaveModel=(()=>{
  const attachmentRules={
    marriage:{all:['结婚证明']},
    sick:{threshold:1,items:['诊断证明','病历','医疗费用单据']},
    bereavement:{all:['死亡证明','亲属关系证明']},
    maternity:{all:['生育证明','出生证明']},
    prenatal:{all:['产检证明']}
  };
  function requiredAttachments(type,duration){
    const rule=attachmentRules[type];
    if(!rule)return[];
    if(rule.all)return rule.all.slice();
    if(rule.threshold!=null&&Number(duration)>rule.threshold)return rule.items.slice();
    return[];
  }
  function hourDuration(start,end,rest,max){
    if(!start||!end)return 0;
    const value=(new Date(end)-new Date(start))/3600000-Number(rest||0);
    return Math.max(0,Math.ceil(Math.min(Number(max||8),value)*2)/2);
  }
  function dateRangeOverlap(aStart,aEnd,bStart,bEnd){return String(aEnd)>=String(bStart)&&String(aStart)<=String(bEnd)}
  function recordActions(record){
    if(record.status==='审批中')return['撤回'];
    if(record.status==='已撤回'||record.status==='已驳回')return['重新提交'];
    if(record.kind==='leave'&&record.status==='审批完成'&&record.follow!=='已销假')return['撤销'];
    return[];
  }
  function canCancel(record){
    if(!record||record.status!=='审批完成'||record.follow==='已销假')return{ok:false,reason:'休假状态已变化，请刷新后重试'};
    if(record.pendingCancel||record.follow==='销假审批中')return{ok:false,reason:'该休假已有销假申请正在审批，不允许重复提交'};
    if(record.archiveMode==='partial'||record.archiveMode==='full')return{ok:false,reason:'该休假包含已封存考勤日期，不允许销假'};
    return{ok:true,reason:''};
  }
  return{requiredAttachments,hourDuration,dateRangeOverlap,recordActions,canCancel};
})();

const state={page:'balance',stack:[],recordTab:'leave',selected:null,demo:new URLSearchParams(location.search).get('demo')!=='0',scenario:'day',form:null,cancelForm:null,lastSubmitKind:'leave',filters:{type:'',status:'',follow:'',start:'',end:''},uploaded:new Set(),errors:{}};
const $=id=>document.getElementById(id);
const escapeHtml=value=>String(value??'').replace(/[&<>"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[char]));
function formatDateTime(value){return value?String(value).replace('T',' ').replaceAll('-','/'):''}
function dateOnly(value){return String(value||'').slice(0,10)}
function isWeekend(date){const day=new Date(`${date}T00:00:00`).getDay();return day===0||day===6}
function dateRange(start,end){const rows=[];if(!start||!end)return rows;const a=new Date(`${dateOnly(start)}T00:00:00`),b=new Date(`${dateOnly(end)}T00:00:00`);if(isNaN(a)||isNaN(b)||a>b)return rows;for(const d=new Date(a);d<=b&&rows.length<180;d.setDate(d.getDate()+1)){const text=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;rows.push(text)}return rows}
function addEligibleDays(start,count,natural){const cursor=new Date(`${dateOnly(start)}T00:00:00`);let used=0;while(used<count){if(natural||!isWeekend(cursor.toISOString().slice(0,10)))used++;if(used<count)cursor.setDate(cursor.getDate()+1)}return cursor.toISOString().slice(0,10)}

function goBack(){const page=state.stack.pop()||'balance';document.querySelectorAll('.page').forEach(node=>node.classList.toggle('active',node.id===`page-${page}`));state.page=page}

function buildDailyLines(){
  const form=state.form,cfg=leaveTypeConfig[form.type],scenario=currentScenario();form.daily=[];

  const valid=dateRange(form.start,form.end).filter(date=>!isWeekend(date));form.daily=valid.map((date,index)=>({date,start:scenario.shift==='fixed'?(index===0?String(form.start).slice(11,16)||'09:00':'09:00'):(index===0?String(form.start).slice(11,16):''),end:scenario.shift==='fixed'?(index===valid.length-1?String(form.end).slice(11,16)||'18:00':'18:00'):(index===valid.length-1?String(form.end).slice(11,16):''),rest:index===1&&scenario.shift==='fixed'?0:index===0?1:'',locked:index===1&&scenario.shift==='fixed'}));

function dayCount(){const cfg=leaveTypeConfig[state.form.type],dates=dateRange(state.form.start,state.form.end);return dates.filter(date=>cfg.dayBasis==='natural'||!isWeekend(date)).length}
function calculateForm(){

function clearDateFilter(){state.filters.start='';state.filters.end='';closeSheet();renderRecords()}
function confirmDateFilter(){state.filters.start=$('filterStart').value;state.filters.end=$('filterEnd').value;closeSheet();renderRecords()}

function openRecordDetail(kind,id){const record=(kind==='leave'?leaveOrders:cancelOrders).find(item=>item.id===id);if(!record)return;state.selected=record;renderDetail(record);navigate('detail')}
function infoItem(label,value,full=false,raw=false){return`<div class="info-item ${full?'full':''}"><div class="info-label">${label}</div><div class="info-value">${raw?value:escapeHtml(value||'—')}</div></div>`}
function renderDetail(record){
  const isCancel=record.kind==='cancel',cfg=leaveTypeConfig[record.type];$('detailTitle').textContent=isCancel?'销假详情':'休假详情';let info='';
  if(isCancel)info=infoItem('姓名','陈思远')+infoItem('工号','cs013')+infoItem('原休假申请',`<button class="source-link" onclick="openRecordDetail('leave','${record.source}')">${record.source}　查看详情</button>`,true,true)+infoItem('休假类别',cfg.name)+infoItem('销假开始时间',formatDateTime(record.start))+infoItem('销假结束时间',formatDateTime(record.end))+infoItem('销假时长',record.duration)+infoItem('销假说明',record.reason,true)+infoItem('附件','无',true);
  else info=infoItem('姓名','陈思远')+infoItem('工号','cs013')+infoItem('休假类别',cfg.name)+infoItem('开始时间',formatDateTime(record.start))+infoItem('结束时间',formatDateTime(record.end))+infoItem('休假时长',record.duration)+infoItem('休假说明',record.reason,true)+infoItem('附件',(record.attachments||[]).join('、')||'无',true)+(record.cancelId?infoItem('关联销假申请',`<button class="source-link" onclick="openRecordDetail('cancel','${record.cancelId}')">查看关联销假详情　›</button>`,true,true):'');
  const archive=record.archiveMode==='partial'?'<div class="notice danger">本次休假包含已封存考勤日。本期仅支持整单销假，因此不可发起销假。</div>':record.archiveMode==='full'?'<div class="notice danger">本次休假涉及的考勤日均已封存，不可发起销假。</div>':'';
  const daily=!isCancel&&record.daily?.length?`<section class="card"><div class="section-label">休假时长明细</div>${record.daily.map(row=>`<div class="daily-card"><div class="daily-date"><span>${row.date.replaceAll('-','/')}</span><b>${row.duration}</b></div><div style="font-size:14px;color:var(--muted)">${row.start}—${row.end} · 扣减休息 ${row.rest}${typeof row.rest==='number'?'小时':''}</div>${row.archived?`<div class="notice danger" style="margin:12px 0 0">已封存 · ${row.archiveTime}</div>`:'<div style="font-size:13px;color:var(--success);margin-top:9px">未封存</div>'}</div>`).join('')}</section>`:'';
  $('detailContent').innerHTML=`<section class="summary-card"><div class="summary-row"><div><div class="summary-title">${cfg.name}${isCancel?'销假申请':'申请'}</div><div class="summary-meta">申请单号：${record.id}<br>发起人：陈思远　创建时间：${record.created}</div></div>${statusTag(record.status)}</div></section>${archive}<section class="card"><div class="section-label">${isCancel?'销假信息':'休假信息'}</div><div class="info-grid">${info}</div></section>${daily}<section class="card"><div class="section-label" style="background:transparent;padding-left:0">审批记录</div><div class="timeline">${timelineHtml(record)}</div></section>`;
  const actions=leaveModel.recordActions(record),bar=$('detailActions');bar.innerHTML=actions.map(action=>`<button class="btn ${action==='撤回'?'danger':action==='重新提交'?'warning':'primary'}" onclick="handleRecordAction(event,'${record.kind}','${record.id}','${action}')">${action}</button>`).join('');bar.classList.toggle('hidden',!actions.length);bar.classList.toggle('single',actions.length===1);$('detailContent').style.paddingBottom=actions.length?'128px':'28px';
}
function timelineHtml(record){let rows=[{title:'提交申请',meta:`陈思远｜${record.created}`,cls:''}];if(record.status==='审批中')rows.push({title:'当前审批',meta:`${record.approver||'直属领导'}｜处理中`,cls:'pending'});if(record.status==='审批完成')rows.push({title:'审批通过',meta:'直属领导｜已完成',cls:''});if(record.status==='已驳回')rows.push({title:'审批驳回',meta:'直属领导｜请补充材料后重新提交',cls:'red'});if(record.status==='已撤回')rows.push({title:'撤回申请',meta:'陈思远｜已撤回',cls:'gray'});return rows.map(row=>`<div class="timeline-item"><div class="timeline-dot ${row.cls}"></div><div class="timeline-title">${row.title}</div><div class="timeline-meta">${row.meta}</div></div>`).join('')}
function handleRecordAction(event,kind,id,action){event?.stopPropagation();const record=(kind==='leave'?leaveOrders:cancelOrders).find(item=>item.id===id);if(!record)return;if(action==='撤回'){showModal('撤回申请','确认撤回当前申请？撤回后，可从列表重新提交。',[{label:'取消',onClick:closeModal},{label:'确认撤回',primary:true,danger:true,onClick:()=>{closeModal();withdrawRecord(kind,id)}}]);return}if(action==='重新提交'){resubmitRecord(kind,id);return}if(action==='撤销')tryOpenCancel(record)}
function withdrawRecord(kind,id){const record=(kind==='leave'?leaveOrders:cancelOrders).find(item=>item.id===id);record.status='已撤回';if(kind==='cancel'){const source=leaveOrders.find(item=>item.id===record.source);if(source)source.follow='—'}showToast('申请已撤回');if(state.page==='detail')renderDetail(record);else renderRecords()}
function resubmitRecord(kind,id){const record=(kind==='leave'?leaveOrders:cancelOrders).find(item=>item.id===id);if(kind==='leave')openResubmitApply(record);else{const source=leaveOrders.find(item=>item.id===record.source);openCancel(source,record)}}
function tryOpenCancel(record){const pending=cancelOrders.some(item=>item.source===record.id&&item.status==='审批中'),result=leaveModel.canCancel({...record,pendingCancel:pending});if(result.ok){openCancel(record);return}if(record.archiveMode==='partial'||record.archiveMode==='full'){const rows=(record.daily||[]).map(row=>`<div class="daily-card"><div class="daily-date"><span>${row.date.replaceAll('-','/')}</span><span class="tag ${row.archived?'red':'green'}">${row.archived?'已封存':'未封存'}</span></div><div style="font-size:14px;color:var(--muted)">${row.start}—${row.end} · ${row.duration}${row.archiveTime?` · 封存时间 ${row.archiveTime}`:''}</div></div>`).join('');showModal('无法销假',`<div class="notice danger">该休假包含已封存考勤日期，不允许销假。</div>${rows}`);return}showModal('无法销假',result.reason)}

function openCancel(leaveRecord,cancelRecord=null){state.selected=leaveRecord;state.cancelForm={reason:cancelRecord?.reason||'',attachment:false,resubmitId:cancelRecord?.id||''};renderCancel();navigate('cancel')}
function renderCancel(){const record=state.selected,form=state.cancelForm;$('cancelTitle').textContent=form.resubmitId?'重新提交销假':'销假申请';$('cancelContent').innerHTML=`<div class="notice">销假范围与原休假申请一致。本期仅支持整单销假。</div><section class="card"><div class="section-label">销假信息</div><div class="info-grid">${infoItem('原休假申请',`<button class="source-link" onclick="openRecordDetail('leave','${record.id}')">${record.id}　查看详情</button>`,true,true)}${infoItem('休假类别',typeName(record.type))}${infoItem('销假开始时间',formatDateTime(record.start))}${infoItem('销假结束时间',formatDateTime(record.end))}${infoItem('销假时长',record.duration)}</div></section><div class="section-label">申请说明</div><section class="card"><div class="textarea-wrap ${form.error?'invalid':''}" style="padding:0"><div class="textarea-head"><span class="textarea-label"><span class="required">*</span>销假说明</span><span class="counter">${form.reason.length}/32766</span></div><textarea class="textarea" maxlength="32766" placeholder="请输入销假说明" oninput="updateCancelReason(this.value,this)">${escapeHtml(form.reason)}</textarea><div class="error-text">必填项不能为空</div></div></section><div class="section-label">附件</div><section class="card"><button class="upload-item ${form.attachment?'done':''}" type="button" onclick="toggleCancelAttachment()"><span class="upload-icon">${form.attachment?'✓':'＋'}</span>${form.attachment?'销假说明.pdf':'添加附件'}</button><div style="font-size:13px;color:var(--muted);margin-top:12px">最多上传5个文件</div></section>`}
function updateCancelReason(value,element){state.cancelForm.reason=value;state.cancelForm.error=false;element.closest('.textarea-wrap').classList.remove('invalid');element.closest('.textarea-wrap').querySelector('.counter').textContent=`${value.length}/32766`}
function toggleCancelAttachment(){state.cancelForm.attachment=!state.cancelForm.attachment;renderCancel()}
function submitCancel(){const form=state.cancelForm,source=state.selected;if(!form.reason.trim()){form.error=true;renderCancel();showToast('请填写销假说明');return}if(form.resubmitId){const record=cancelOrders.find(item=>item.id===form.resubmitId);Object.assign(record,{reason:form.reason,status:'审批中',approver:'直属领导'});source.follow='销假审批中'}else{source.follow='销假审批中';cancelOrders.unshift({id:`C${Date.now()}`,source:source.id,kind:'cancel',type:source.type,start:source.start,end:source.end,duration:source.duration,reason:form.reason,status:'审批中',created:'2026-08-28 18:35',approver:'直属领导'})}state.lastSubmitKind='cancel';$('successSub').textContent='销假申请已进入审批流程';$('successPage').classList.add('show')}
function closeSuccess(home){$('successPage').classList.remove('show');if(home){state.stack=[];document.querySelectorAll('.page').forEach(node=>node.classList.toggle('active',node.id==='page-balance'));state.page='balance'}else{state.recordTab=state.lastSubmitKind;renderRecords();state.stack=[];document.querySelectorAll('.page').forEach(node=>node.classList.toggle('active',node.id==='page-records'));state.page='records'}}

renderBalance();
</script>
