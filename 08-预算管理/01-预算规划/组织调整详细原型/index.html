<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>组织调整 · 人力规划</title><link rel="stylesheet" href="style.css?v=20261021-dialog-cleanup"></head>
<body>
<header class="header"><a class="brand" title="返回原型首页" aria-label="HRONE，返回原型首页" href="../../../index.html" target="_top">HRONE</a><span class="breadcrumb">人力规划 / 二级A组织</span><span class="demo">交互演示</span><button class="text muted" id="reset">恢复示例</button></header>
<main>
  <nav class="steps" aria-label="规划步骤"><span class="step active"><b>1</b>组织调整</span><span class="connector"></span><span class="step"><b>2</b>职位与编制规划</span></nav>
  <section class="workspace" aria-label="组织调整">
    <div class="toolbar"><div class="toolbar-left"><h1>组织架构</h1><div class="button-group tree-tools"><button id="expand">展开全部</button><button id="collapse">收起全部</button></div></div><div class="button-group"><button id="preview" class="primary">预览架构</button><button id="import-org">导入</button></div></div>
    <div class="table-scroll"><table><colgroup><col style="width:32%"><col style="width:22%"><col style="width:12%"><col style="width:14%"><col style="width:20%"></colgroup><thead><tr><th><div class="th-content">组织名称<button class="filter" data-filter="name" aria-label="筛选组织名称"></button></div></th><th>上级组织</th><th>组织层级</th><th><div class="th-content">部门负责人<button class="filter" data-filter="owner" aria-label="筛选部门负责人"></button></div></th><th>操作</th></tr></thead><tbody id="org-rows"></tbody></table></div>
    <div id="table-info" class="table-info" hidden></div>
  </section>
</main>
<footer class="page-footer"><span id="save-time" class="muted" hidden></span><div class="button-group"><button id="draft">保存为草稿</button><button id="next" class="primary">下一步</button></div></footer>
<div id="filter-popover" class="filter-popover" hidden></div>
<dialog id="editor" aria-labelledby="editor-title"><form id="org-form" novalidate><div class="modal-header"><h2 id="editor-title">编辑组织</h2><button type="button" class="close" data-close="editor" aria-label="关闭组织编辑">×</button></div><div class="modal-body"><section class="org-form-section"><h3>基本信息</h3><div class="form-grid"><label><span>设立日期 <small class="formal-required" title="正式组织必填，规划阶段可先保存后补齐">正式必填</small></span><input type="date" id="org-establish-date"></label><label id="org-code-field" hidden>编码<input id="org-code" readonly></label><label id="org-change-date-field" hidden><span>变动生效日期 <small class="formal-required" title="正式组织必填，规划阶段可先保存后补齐">正式必填</small></span><input type="date" id="org-change-date"></label><div class="form-field"><label for="org-name">名称 <span class="required">*</span></label><div class="name-input"><input id="org-name" name="name" maxlength="100" autocomplete="off" required><button type="button" class="text" id="toggle-languages" aria-expanded="false">多语言</button></div></div><label>上级组织 <span class="required">*</span><select id="org-parent" name="parent" required></select></label><label>组织层级<input id="org-level" readonly></label><label><span>排序码 <small class="formal-required" title="正式组织必填，规划阶段可先保存后补齐">正式必填</small></span><input type="number" min="0" max="100000" step="1" id="org-sort"></label><label><span>是否虚拟组织 <small class="formal-required" title="正式组织必填，规划阶段可先保存后补齐">正式必填</small></span><select id="org-virtual"><option value="false">否</option><option value="true">是</option></select></label><label>拓网组织编码<input id="org-mapping-code"></label></div><div id="org-language-panel" class="language-panel" hidden><div class="form-grid" id="org-language-fields"></div></div></section><section class="org-form-section"><h3>组织角色</h3><div class="form-grid" id="org-role-fields"></div><datalist id="org-people"></datalist></section><section class="org-form-section"><h3>成本信息</h3><div class="form-grid"><label><span>一级成本中心 <small class="formal-required" title="正式组织必填，规划阶段可先保存后补齐">正式必填</small></span><input id="org-cost-center" list="org-cost-center-options" placeholder="搜索一级成本中心分摊规则" autocomplete="off"></label><label><span>财务用-成本分类 <small class="formal-required" title="正式组织必填，规划阶段可先保存后补齐">正式必填</small></span><select id="org-cost-class"><option value="">请选择</option><option>营销</option><option>职能</option><option>交付类</option></select></label></div><datalist id="org-cost-center-options"><option value="示例成本中心A-100%"><option value="示例成本中心B-100%"><option value="示例成本中心A-50%&示例成本中心B-50%"></datalist></section><p class="planning-field-note">标记“正式必填”的信息可在规划中逐步补齐，保存规划不会使正式组织生效。</p><p id="editor-error" class="error" role="alert"></p></div><div class="modal-footer"><button type="button" data-close="editor">取消</button><button type="submit" class="primary">保存</button></div></form></dialog>
<dialog id="confirm" class="small" aria-labelledby="confirm-title"><div class="modal-header"><h2 id="confirm-title"></h2><button class="close" data-close="confirm" aria-label="关闭确认">×</button></div><div class="modal-body" id="confirm-body"></div><div class="modal-footer"><button data-close="confirm">取消</button><button id="confirm-action" class="primary">确认</button></div></dialog>
<dialog id="preview-dialog" class="large" aria-labelledby="preview-title"><div class="modal-header"><h2 id="preview-title">预览架构</h2><button class="close" data-close="preview-dialog" aria-label="关闭架构预览">×</button></div><div class="preview-controls"><div class="view-switch" role="group" aria-label="预览视图"><button id="list-view" aria-pressed="true" class="selected">列表视图</button><button id="chart-view" aria-pressed="false">组织架构图</button></div><label class="check"><input type="checkbox" id="show-stopped">显示拟定停用组织</label><div class="button-group"><button id="preview-expand">展开全部</button><button id="preview-collapse">收起全部</button></div></div><div class="preview-body"><div id="preview-tree" class="preview-tree"></div><aside id="change-detail" class="change-detail"></aside></div><div class="modal-footer"><button data-close="preview-dialog">关闭预览</button></div></dialog>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script src="org-fields.js?v=20261020-confirmed1"></script><script src="model.js?v=20261020-confirmed1"></script><script src="app.js?v=20261021-demo-org1"></script><script src="preview.js?v=20261021-chart-tags"></script><script src="drag.js?v=20261018-step2"></script></body></html>
