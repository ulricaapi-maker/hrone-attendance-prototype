<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>职位与编制规划 · 交互原型</title><link rel="stylesheet" href="style.css?v=20261021-binding-compact1"></head><body>
<header><a class="brand" title="返回原型首页" href="../组织调整详细原型/index.html">HRONE</a><span>人力规划 / 二级A组织</span><span class="demo">规划交互原型 · 示例数据</span></header>
<nav class="steps" aria-label="规划步骤"><a href="../组织调整详细原型/index.html"><b>✓</b>组织调整</a><i></i><span><b>2</b>职位与编制规划</span></nav>
<main><aside class="org-panel"><div class="aside-title">拟定组织架构</div><div id="org-tree"></div><div id="stopped-list"></div><label class="include"><input type="checkbox" id="include-children">包含下级组织</label></aside>
<section class="workspace"><div class="dept-heading"><div><h1 id="dept-name"></h1><span id="dept-status"></span></div><span id="pending-count"></span><div id="staffing-views" class="staffing-views" role="group" aria-label="明细展示方式"><button id="view-grouped" aria-pressed="true">职位分组</button><button id="view-flat" aria-pressed="false">平铺明细</button></div></div>
<div id="planning-tabs" class="planning-tabs" role="tablist" aria-label="规划列表"><button id="headcount-tab" role="tab" aria-selected="true">编制列表</button><button id="people-tab" role="tab" aria-selected="false">人员列表</button></div><div id="processing-tabs" class="processing-tabs" hidden><button id="pending-tab">待处理</button><button id="processed-tab">已处理</button></div><div class="toolbar"><div class="buttons" id="active-tools"><button id="add-position">新增职位</button><button id="add-hc" class="primary">新增编制</button><button id="arrange">批量人员调整</button><button id="edit-hc">批量编辑编制</button><button id="positions">职位管理</button></div><div class="buttons" id="batch-vacancy-tools" hidden><button id="batch-migrate-hc">批量迁移</button><button id="batch-stop-hc">批量停用</button></div><div class="buttons" id="source-tools" hidden><button id="transfer" class="primary">批量转移</button></div><span id="selected-count" class="muted"></span></div>
<div id="headcount-display-tools" class="headcount-display-tools"><div class="view-switch" role="group" aria-label="编制展示方式"><button id="final-position-view" aria-pressed="true">职位视图</button><button id="final-list-view" aria-pressed="false">列表视图</button></div><input type="checkbox" id="group-headcounts" hidden><span id="headcount-view-hint" hidden></span><span id="occupancy-summary" aria-live="polite"></span></div><div class="table-scroll"><table id="plan-table"><colgroup id="columns"></colgroup><thead id="table-head"></thead><tbody id="table-body"></tbody></table></div><div class="table-bottom"><span id="row-count" hidden></span><button class="text" id="adjustment-history">调整记录</button><label id="pending-switch" hidden><input type="checkbox" id="pending-only">只看待安排</label><button class="text" id="clear-filters" hidden>清除筛选</button></div></section></main>
<footer><a href="../组织调整详细原型/index.html">上一步</a><span id="save-status" class="muted" hidden></span><div class="buttons"><button id="save">保存为草稿</button><button id="finish" class="primary">完成规划</button></div></footer>
<div id="filter-popover" hidden></div><div id="toast" role="status" aria-live="polite" hidden></div>
<dialog id="detail" class="headcount-detail" aria-labelledby="detail-title"><div class="modal-header"><h2 id="detail-title"></h2><button class="close" data-close="detail" aria-label="关闭明细">×</button></div><div class="modal-body" id="detail-body"></div><div class="modal-footer"><button data-close="detail">关闭</button></div></dialog>
<dialog id="arrange-dialog" aria-labelledby="arrange-title"><div class="modal-header"><h2 id="arrange-title">人员调整</h2><button class="close" data-close="arrange-dialog" aria-label="关闭调整">×</button></div><div class="modal-body"><div id="single-identity"></div><p id="transfer-summary"></p><label class="target-label"><span>目标部门 <em>*</em></span><select id="arrange-dept" aria-label="目标部门"></select></label><fieldset id="binding-mode" class="binding-mode"><legend>编制处理</legend><label><input type="radio" name="binding-mode" value="carry" checked>携带原编制</label><label><input type="radio" name="binding-mode" value="target">使用目标部门编制</label></fieldset><div id="single-target" class="target-label"><label for="single-position"><span id="target-field-label">目标职位</span> <em>*</em></label><select id="single-position" aria-label="目标职位"></select><small id="single-position-hint" class="muted"></small></div><div id="batch-tools" class="bulk-position" hidden><select id="bulk-position" aria-label="批量设置目标职位"></select><button id="apply-bulk-position" type="button">应用到全部</button></div><div id="batch-target" class="mapping-scroll"><table class="transfer-table"><thead><tr><th>员工 / 编制</th><th>原职位</th><th id="mapping-target-heading">目标职位</th></tr></thead><tbody id="position-mappings"></tbody></table></div><div id="target-hc-preview" class="target-hc-preview" hidden></div><p id="binding-impact" class="binding-impact" hidden></p><p id="transfer-note" class="small muted transfer-note">员工与占用编制一起调整，编制职级、海外属性、工作地点及预计到岗时间保留。</p><p class="error" id="arrange-error" role="alert"></p></div><div class="modal-footer"><button data-close="arrange-dialog">取消</button><button id="apply-arrange" class="primary">确定</button></div></dialog>
<dialog id="hc-dialog" aria-labelledby="hc-title"><form id="hc-form" novalidate><div class="modal-header"><h2 id="hc-title">新增编制</h2><button type="button" class="close" data-close="hc-dialog" aria-label="关闭编制编辑">×</button></div><div class="modal-body"><div class="form-grid"><label>编制部门 <em>*</em><select id="hc-dept"></select></label><label>编制职位 <em>*</em><select id="hc-position"></select><button type="button" class="text inline-add" id="hc-add-position">新增职位</button></label><label>编制职级 <em>*</em><select id="hc-grade"></select></label><label>是否海外编制 <em>*</em><select id="hc-overseas"><option value="false">否</option><option value="true">是</option></select></label><label>编制工作地点 <em>*</em><input id="hc-place" maxlength="120" autocomplete="off"></label><label>预计到岗时间 <em>*</em><input type="date" id="hc-arrival"></label><label id="hc-quantity-label">编制数 <em>*</em><input type="number" min="1" max="50" value="1" id="hc-quantity"></label></div><p id="hc-range" class="small muted"></p><p class="error" id="hc-error" role="alert"></p></div><div class="modal-footer"><button type="button" data-close="hc-dialog">取消</button><button class="primary" type="submit">保存</button></div></form></dialog>
<dialog id="position-dialog" class="small-dialog" aria-labelledby="position-title"><form id="position-form" novalidate><div class="modal-header"><h2 id="position-title">新增职位</h2><button type="button" class="close" data-close="position-dialog" aria-label="关闭职位表单">×</button></div><div class="modal-body"><div class="form-grid"><label>所属部门 <em>*</em><select id="position-dept"></select></label><label>职位名称 <em>*</em><input id="position-name" maxlength="120"></label><label>最低职级 <em>*</em><select id="position-min"></select></label><label>最高职级 <em>*</em><select id="position-max"></select></label></div><p id="position-error" class="error" role="alert"></p></div><div class="modal-footer"><button type="button" data-close="position-dialog">取消</button><button class="primary" type="submit">保存</button></div></form></dialog>
<dialog id="position-list" class="drawer position-manager" aria-labelledby="position-list-title"><div class="modal-header"><h2 id="position-list-title">职位管理</h2><button class="close" data-close="position-list" aria-label="关闭职位管理">×</button></div><div class="modal-body"><div class="manager-toolbar"><button id="manager-add-position" class="primary">新增职位</button></div><div class="manager-scroll"><table class="position-table"><thead><tr><th>职位</th><th>职级范围</th><th>在职</th><th>空编</th><th>操作</th></tr></thead><tbody id="position-list-body"></tbody></table></div></div><div class="modal-footer"><button data-close="position-list">关闭</button></div></dialog>
<dialog id="confirm-dialog" class="small-dialog" aria-labelledby="confirm-title"><div class="modal-header"><h2 id="confirm-title"></h2><button class="close" data-close="confirm-dialog" aria-label="关闭确认">×</button></div><div class="modal-body" id="confirm-body"></div><div class="modal-footer"><button data-close="confirm-dialog">取消</button><button class="primary" id="confirm-action">确认</button></div></dialog>
<dialog id="bind-person-dialog" class="bind-person-form" aria-labelledby="bind-person-title"><div class="modal-header"><h2 id="bind-person-title">绑定人员</h2><button class="close" data-close="bind-person-dialog" aria-label="关闭绑定人员">×</button></div><div class="modal-body"><div class="form-grid"><label>员工 <em>*</em><select id="bind-person-select" aria-label="员工"><option value="">请选择员工</option></select></label></div><div class="form-grid bind-date-row"><label>计划调入日期 <em>*</em><input id="bind-person-date" type="date" aria-label="计划调入日期"></label></div><p id="bind-person-error" class="error" role="alert"></p></div><div class="modal-footer"><button data-close="bind-person-dialog">取消</button><button id="confirm-bind-person" class="primary">确认绑定</button></div></dialog>
<dialog id="stop-position-dialog" class="wide" aria-labelledby="stop-position-title"><div class="modal-header"><h2 id="stop-position-title">停用职位</h2><button class="close" data-close="stop-position-dialog" aria-label="关闭职位停用">×</button></div><div class="modal-body"><div id="stop-summary" class="impact-summary"></div><div id="stop-simple"><div id="stop-simple-destination"><h3 class="stop-section-title">在职员工及其编制</h3><div class="form-grid"><label>目标部门<select id="stop-simple-dept"></select></label><label>目标职位<select id="stop-simple-target"></select><button id="stop-simple-new-position" class="text inline-add" type="button">新增目标职位</button></label></div></div><div id="stop-simple-empty"><h3 class="stop-section-title">空编处理</h3><select id="stop-simple-vacancies" aria-label="空编处理方式"><option value="stop">停用</option><option value="move">一并调整至上述职位</option></select></div></div><div class="stop-mode-line"><button id="stop-detail-toggle" class="text">分别调整</button><span class="muted small">需要分到不同部门或改占目标编制时使用</span></div><div id="stop-details" hidden><div class="stop-bulk"><span id="stop-selected-count">已选 0 条</span><label>处理方式<select id="stop-bulk-mode"><option value="carry">携带原编制</option><option value="target">使用目标部门编制</option><option value="move">编辑空编制去向</option><option value="stop">停用空编制</option></select></label><label>目标部门<select id="stop-bulk-dept"></select></label><label>目标职位 / 编制<select id="stop-bulk-target"></select></label><button id="stop-apply-bulk">应用到已选</button><button id="stop-new-position" class="text">新增目标职位</button></div><div class="stop-scroll"><table class="stop-table"><thead><tr><th><input type="checkbox" id="stop-select-all" aria-label="全选职位下编制"></th><th>编制 / 员工</th><th>处理方式</th><th>目标部门</th><th>目标职位 / 编制</th><th>原空编去向</th></tr></thead><tbody id="stop-rows"></tbody></table></div></div><p class="small muted">携带原编制保留编制属性；使用目标编制保留目标编制属性。员工当前任职信息与当前职级不变。</p><p id="stop-error" class="error" role="alert"></p></div><div class="modal-footer"><button data-close="stop-position-dialog">取消</button><button id="confirm-position-stop" class="primary">确认停用</button></div></dialog>
<dialog id="history-dialog" class="drawer history-drawer" aria-labelledby="history-title"><div class="modal-header"><h2 id="history-title">调整记录</h2><button class="close" data-close="history-dialog" aria-label="关闭调整记录">×</button></div><div class="modal-body" id="history-body"></div><div class="modal-footer"><button data-close="history-dialog">关闭</button></div></dialog>
<script src="../组织调整详细原型/model.js?v=20261021-binding-compact1"></script><script src="data.js?v=20261021-binding-compact1"></script><script src="app.js?v=20261021-binding-compact1"></script><script src="operations.js?v=20261021-binding-compact1"></script><script src="planning-views.js?v=20261021-binding-compact1"></script><script src="final-workflows.js?v=20261021-binding-compact1"></script><script src="stop-tabs.js?v=20261021-binding-compact1"></script><script src="planning-import.js?v=20261021-binding-compact1"></script><script src="planning-preview.js?v=20261021-binding-compact1"></script><script src="budget-sketch.js?v=20261021-binding-compact1"></script><script src="people-updates.js?v=20261021-binding-compact1"></script><script src="position-copy.js?v=20261021-binding-compact1"></script></body></html>
